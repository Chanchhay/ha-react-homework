# Complete HAProxy configuration for LB-02
# React production servers: 192.168.56.20:3000 and 192.168.56.21:3000
global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend react_frontend
    bind *:80
    mode http
    http-response set-header X-Load-Balancer LB-02
    default_backend react_servers

backend react_servers
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web01 192.168.56.20:3000 check inter 2s fall 2 rise 2
    server web02 192.168.56.21:3000 check inter 2s fall 2 rise 2
