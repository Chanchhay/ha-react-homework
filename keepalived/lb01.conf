# Keepalived LB-01; interface is eth1 in this Vagrant image
global_defs {
    router_id LB_01
    script_user root
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/bin/systemctl is-active --quiet haproxy"
    interval 2
    timeout 2
    weight 0
    fall 2
    rise 2
}

vrrp_instance VI_1 {
    state BACKUP
    interface eth1
    virtual_router_id 51
    priority 150
    advert_int 1

    unicast_src_ip 192.168.56.10
    unicast_peer {
        192.168.56.11
    }
    check_unicast_src

    virtual_ipaddress {
        192.168.56.100/24 dev eth1
    }

    track_script {
        chk_haproxy
    }
}
